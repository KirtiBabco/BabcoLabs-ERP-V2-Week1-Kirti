name: Week 1 Live Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/probe-trigger'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe live host
        shell: bash
        run: |
          set +e
          BASE="https://app-babco-w1-kirti-rnd-260918.azurewebsites.net"
          for PATHX in / /health /api/v1/lab/startup /api/v1/workflow-definitions; do
            echo "===== $PATHX ====="
            curl --max-time 20 -sS -D /tmp/h -o /tmp/b -w "HTTP=%{http_code} TIME=%{time_total}\n" "$BASE$PATHX"
            cat /tmp/h
            echo "BODY:"
            head -c 2000 /tmp/b
            echo
          done
          exit 0
